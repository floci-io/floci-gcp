quarkus:
  log:
    level: WARN
    category:
      "io.floci.gcp":
        level: INFO
  http:
    test-ssl-port: 4599

floci-gcp:
  port: 4588
  default-project-id: test-project
  tls:
    certificate: src/test/resources/tls/cert.pem
    certificate-key: src/test/resources/tls/key.pem
  storage:
    mode: memory
  services:
    iamcredentials:
      enabled: true
    sts:
      enabled: true
    datastore:
      enabled: true
    kafka:
      enabled: true
      mock: true
    cloudsql:
      enabled: true
      mock: true
    cloudtasks:
      enabled: true
    cloudrun:
      enabled: true
      mock: true
      execution:
        default-port: 8080
        startup-timeout: 240s
        request-timeout: 300s
        operation-timeout: 300s
        cleanup-timeout: 15s
        url-host-suffix:
    cloudfunctions:
      enabled: true
    monitoring:
      enabled: true
    scheduler:
      enabled: true
      invocation-enabled: true
      tick-interval-seconds: 1
    eventarc:
      enabled: true
    bigquery:
      enabled: true
    gke:
      enabled: true
      mock: true
    serviceusage:
      enabled: true
    resourcemanager:
      enabled: true
    firebaseauth:
      enabled: true
  docker:
    api-timeout: 30s
    resource-namespace: ""
