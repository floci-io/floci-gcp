name: Compatibility Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'docker/Dockerfile.native-package'
      - 'docker/entrypoint.sh'
      - 'docker/Dockerfile.compat'
      - 'bin/gcplocal'
      - 'compatibility-tests/**'
      - '.github/workflows/compatibility.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    name: Build native floci-gcp image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          # no `cache: maven` - it keys on setup-graalvm-Linux-maven-<hash>, a key only
          # this pull_request-only workflow ever writes. Actions caches are ref-scoped, so
          # those writes land in refs/pull/N/merge and no run can read another's: it misses
          # every time while still saving hundreds of MB nothing will read.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Restore-only, keyed identically to ci.yml so this reads the ~/.m2 that ci.yml saves
      # on push to main. ci.yml stays the single writer; a second writer would race it.
      # Partial-hit caveat: ci.yml runs x64 and this runs arm64, but `runner.os` is Linux
      # for both and Maven artifacts are arch-neutral, so only classifier-based natives
      # re-download. `-Dnative` also pulls native-image plugins `mvn test` never fetches.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build native executable (quick build)
        run: mvn clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-Ob"

      - name: Stage native binary for packaging
        run: |
          mkdir -p native/arm64
          cp target/*-runner native/arm64/application
          cp target/*.so native/arm64/ 2>/dev/null || true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build native Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.native-package
          tags: floci-gcp:test-native
          outputs: type=docker,dest=/tmp/floci-gcp-native-image.tar
          # No layer cache here, deliberately. The COPY below brings in a natively
          # compiled binary that changes every commit, and Docker layer reuse is
          # sequential, so nothing after it can ever be reused: the cache was write-only.
          # `mode=max` still stored the whole image, including that volatile
          # multi-hundred-MB binary layer, once per PR ref.

      - name: Compress native image
        run: gzip /tmp/floci-gcp-native-image.tar

      - name: Upload native floci-gcp image
        uses: actions/upload-artifact@v7
        with:
          name: floci-gcp-native-image
          path: /tmp/floci-gcp-native-image.tar.gz
          retention-days: 1

  # The compat image's tools stage (gcloud, the Python SDKs and gcplocal), against the native
  # emulator built above. It needs no published floci-gcp image: target tools pulls none.
  compat-image-gcplocal:
    name: compat image / gcplocal
    needs: build-native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Download native floci-gcp image
        uses: actions/download-artifact@v8
        with:
          name: floci-gcp-native-image
          path: /tmp

      - name: Load native floci-gcp image
        run: gunzip -c /tmp/floci-gcp-native-image.tar.gz | docker load

      - name: Start floci-gcp
        run: |
          docker network create compat-net
          docker run -d --name floci-gcp --network compat-net -p 4588:4588 \
            -e FLOCI_GCP_BASE_URL=http://floci-gcp:4588 \
            -e FLOCI_GCP_HOSTNAME=floci-gcp \
            -e FLOCI_GCP_TLS_ENABLED=true \
            -e FLOCI_GCP_TLS_HTTPS_PORT=0 \
            floci-gcp:test-native
          timeout 60 bash -c 'until curl -sf http://localhost:4588/health >/dev/null 2>&1; do sleep 1; done'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docker
            bin

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the compat tools stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.compat
          target: tools
          load: true
          tags: floci-gcp-compat-tools

      - name: Run gcplocal against floci-gcp
        run: |
          set -euo pipefail
          # As the compat image's own user, against the emulator on the shared network. The greps
          # read all of their input: grep -q would stop early and break the pipe under pipefail.
          g() { docker run --rm --user 1001 --network compat-net -e FLOCI_GCP_ENDPOINT=http://floci-gcp:4588 "$@"; }
          g floci-gcp-compat-tools gcplocal --version
          test "$(g floci-gcp-compat-tools gcplocal info --format='value(basic.python_location)')" = /usr/bin/python3.12
          g -e CLOUDSDK_AUTH_ACCESS_TOKEN=caller-token floci-gcp-compat-tools gcplocal env | grep -x 'export CLOUDSDK_AUTH_ACCESS_TOKEN=caller-token' >/dev/null
          g floci-gcp-compat-tools gcplocal storage buckets create gs://compat-smoke
          g floci-gcp-compat-tools sh -c 'echo hello > /tmp/h.txt && gcplocal storage cp /tmp/h.txt gs://compat-smoke/h.txt'
          test "$(g floci-gcp-compat-tools gcplocal storage cat gs://compat-smoke/h.txt)" = hello
          g floci-gcp-compat-tools gcplocal secrets create compat-smoke --replication-policy=automatic
          g floci-gcp-compat-tools gcplocal secrets list --format='value(name)' | grep -x compat-smoke >/dev/null
          g floci-gcp-compat-tools gcplocal kms keyrings create compat-smoke --location=global
          g floci-gcp-compat-tools gcplocal kms keyrings list --location=global --format='value(name)' | grep 'keyRings/compat-smoke$' >/dev/null
          g floci-gcp-compat-tools bq version
          ! g floci-gcp-compat-tools sh -c 'command -v gsutil'

      - name: floci-gcp logs on failure
        if: failure()
        run: docker logs floci-gcp | tail -n 100

  native-compat-test:
    name: native / ${{ matrix.test }}
    needs: build-native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        test:
          - sdk-test-java
          - sdk-test-ruby
          - sdk-test-node
          - sdk-test-python
          - sdk-test-go
          - sdk-test-rust
          - sdk-test-gcloud
          - compat-terraform
          - compat-opentofu

    steps:
      - name: Download native floci-gcp image
        uses: actions/download-artifact@v8
        with:
          name: floci-gcp-native-image
          path: /tmp

      - name: Load native floci-gcp image
        run: gunzip -c /tmp/floci-gcp-native-image.tar.gz | docker load

      - name: Create Docker network
        run: docker network create compat-net

      # TLS is enabled for every suite. HTTP and HTTPS share port 4588, so the suites
      # below keep talking plain HTTP unchanged — which makes them a regression guard
      # for the protocol-sniffing proxy — while sdk-test-java's TlsTest exercises
      # HTTPS and gRPC-over-TLS. The extra 443 binding is disabled because the
      # container runs as an unprivileged user.
      - name: Start floci-gcp
        run: |
          DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          KAFKA_MOCK=false
          case "${{ matrix.test }}" in
            sdk-test-*) KAFKA_MOCK=true ;;
          esac
          docker run -d --name floci-gcp --network compat-net \
            --network-alias container.localhost.floci.io \
            -p 4588:4588 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --group-add "$DOCKER_GID" \
            -e FLOCI_GCP_BASE_URL=http://floci-gcp:4588 \
            -e FLOCI_GCP_HOSTNAME=floci-gcp \
            -e FLOCI_GCP_SERVICES_DOCKER_NETWORK=compat-net \
            -e FLOCI_GCP_SERVICES_KAFKA_MOCK="$KAFKA_MOCK" \
            -e FLOCI_GCP_SERVICES_CLOUDRUN_MOCK=false \
            -e FLOCI_GCP_TLS_ENABLED=true \
            -e FLOCI_GCP_TLS_HTTPS_PORT=0 \
            floci-gcp:test-native

      - name: Wait for floci-gcp to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:4588/health >/dev/null 2>&1; do sleep 1; done'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: compatibility-tests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: compatibility-tests/${{ matrix.test }}
          load: true
          tags: compat-${{ matrix.test }}
          # Read-only on purpose. Actions caches are ref-scoped, so a pull_request run's
          # writes land in refs/pull/N/merge, private to that PR: one copy per open PR
          # overran the repo's cache budget and evicted entries between a PR's own runs.
          # warm-compat-caches.yml populates these scopes on main; PRs read that one copy.
          cache-from: type=gha,scope=${{ runner.os }}-${{ runner.arch }}-${{ matrix.test }}

      - name: Run tests
        id: tests
        timeout-minutes: 30
        run: |
          mkdir -p test-results
          docker run --rm --network compat-net \
            -e FLOCI_GCP_ENDPOINT=http://floci-gcp:4588 \
            -e FLOCI_ENDPOINT=http://floci-gcp:4588 \
            -e FLOCI_HOST=floci-gcp:4588 \
            -e FLOCI_PROJECT=test-project \
            -e FLOCI_GCP_CLOUDRUN_EXECUTION_ENABLED=true \
            -v "$(pwd)/test-results:/results" \
            compat-${{ matrix.test }}

      - name: Run downscoped IAM SDK test
        if: matrix.test == 'sdk-test-java'
        timeout-minutes: 10
        run: |
          docker stop floci-gcp
          docker rm floci-gcp
          DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          docker run -d --name floci-gcp --network compat-net \
            --network-alias container.localhost.floci.io \
            -p 4588:4588 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --group-add "$DOCKER_GID" \
            -e FLOCI_GCP_BASE_URL=http://floci-gcp:4588 \
            -e FLOCI_GCP_HOSTNAME=floci-gcp \
            -e FLOCI_GCP_SERVICES_DOCKER_NETWORK=compat-net \
            -e FLOCI_GCP_SERVICES_KAFKA_MOCK=true \
            -e FLOCI_GCP_SERVICES_CLOUDRUN_MOCK=false \
            -e FLOCI_GCP_SERVICES_IAM_AUTHORIZATION_MODE=enforce \
            -e FLOCI_GCP_SERVICES_IAM_BOOTSTRAP_ADMIN_MEMBER=allUsers \
            floci-gcp:test-native
          timeout 60 bash -c 'until curl -sf http://localhost:4588/health >/dev/null 2>&1; do sleep 1; done'
          docker run --rm --network compat-net \
            -e FLOCI_GCP_ENDPOINT=http://floci-gcp:4588 \
            -e FLOCI_ENDPOINT=http://floci-gcp:4588 \
            -e FLOCI_HOST=floci-gcp:4588 \
            -e FLOCI_PROJECT=test-project \
            -e FLOCI_GCP_CLOUDRUN_EXECUTION_ENABLED=true \
            -e FLOCI_GCP_IAM_ENFORCEMENT_COMPAT=true \
            -v "$(pwd)/test-results:/results" \
            --entrypoint /bin/bash \
            compat-sdk-test-java \
            -c 'mvn test -Dtest=GcsDownscopedTokenTest#storageClientEnforcesIamPolicyForDownscopedImpersonatedToken; status=$?; mkdir -p /results; report=target/surefire-reports/TEST-io.floci.gcp.test.GcsDownscopedTokenTest.xml; if [ -f "$report" ]; then cp "$report" /results/TEST-io.floci.gcp.test.GcsDownscopedTokenTest-downscoped-iam.xml; fi; exit $status'

      - name: Verify IAM denials with Java SDK clients
        if: matrix.test == 'sdk-test-java'
        timeout-minutes: 5
        run: |
          docker run -d --name floci-gcp-iam --network compat-net -p 4590:4588 \
            -e FLOCI_GCP_SERVICES_IAM_AUTHORIZATION_MODE=enforce \
            -e FLOCI_GCP_SERVICES_KAFKA_MOCK=true \
            -e FLOCI_GCP_SERVICES_CLOUDSQL_MOCK=true \
            -e FLOCI_GCP_SERVICES_CLOUDRUN_MOCK=true \
            -e FLOCI_GCP_SERVICES_BIGQUERY_MOCK=true \
            floci-gcp:test-native
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4590/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:4590/health
          mkdir -p test-results/iam
          docker run --rm --network compat-net \
            -e FLOCI_GCP_ENDPOINT=http://floci-gcp-iam:4588 \
            -e FLOCI_GCP_IAM_TEST_ENFORCEMENT=true \
            -v "$(pwd)/test-results/iam:/results" \
            --entrypoint /bin/bash compat-sdk-test-java -c \
            'mvn test -Dtest=IamEnforcementTest,IamServiceAccountIamEnforcementTest,CloudRunIamEnforcementTest,PubSubIamEnforcementTest,LoggingExportIamEnforcementTest,SchedulerIamEnforcementTest; status=$?; cp target/surefire-reports/TEST-*IamEnforcementTest.xml /results/; exit $status'
      - name: Generate test summary
        if: always() && steps.tests.outcome != 'skipped'
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: test-results/**/*.xml

      - name: Dump floci-gcp logs
        if: failure() || cancelled()
        run: |
          docker logs floci-gcp
          if docker inspect floci-gcp-iam >/dev/null 2>&1; then docker logs floci-gcp-iam; fi
